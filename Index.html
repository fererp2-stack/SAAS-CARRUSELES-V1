<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flyra — Flyers y carruseles para tu negocio</title>
<meta name="description" content="Crea flyers y carruseles para Instagram en minutos: escribe tu idea, deja que la IA escriba los textos y descarga.">
<meta name="theme-color" content="#2453FF">
<meta property="og:title" content="Flyra — Flyers para tu negocio">
<meta property="og:description" content="Escribe tu idea de venta y obtén tus flyers listos para publicar.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%232453FF'/%3E%3Ctext x='32' y='44' font-family='Arial,Helvetica,sans-serif' font-size='36' font-weight='800' fill='white' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#F5F7FB;--blue:#2453FF;--text:#0E1525;--muted:#556079}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;display:block;background:var(--bg)}
  .splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);transition:opacity .35s;z-index:2}
  .splash.off{opacity:0;pointer-events:none}
  .box{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px;text-align:center;max-width:420px}
  .logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#2453FF,#6C8CFF);color:#fff;display:grid;place-items:center;font-weight:800;font-size:30px;box-shadow:0 10px 30px rgba(36,83,255,.35);animation:pulse 1.4s ease-in-out infinite}
  .name{font-weight:800;font-size:22px;letter-spacing:-.02em}
  .msg{color:var(--muted);font-size:14px}
  .bar{width:160px;height:4px;border-radius:4px;background:#DCE4FF;overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:var(--blue);border-radius:4px;animation:load 1.1s ease-in-out infinite}
  code{background:#EEF2FF;color:#1533B5;border-radius:6px;padding:2px 6px;font-size:13px}
  @keyframes pulse{50%{transform:scale(.94)}}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  @media (prefers-reduced-motion:reduce){.logo,.bar i{animation:none}}
</style>
</head>
<body>
<div class="splash" id="splash">
  <div class="box">
    <div class="logo">F</div>
    <div class="name">Flyra</div>
    <div class="msg" id="msg">Cargando tu espacio de trabajo…</div>
    <div class="bar" id="bar"><i></i></div>
  </div>
</div>

<script>
  /* =====================================================
   *  ÚNICO CAMBIO: pega aquí la URL de tu app de Apps Script
   *  (Implementar > Gestionar implementaciones > URL que termina en /exec)
   * ===================================================== */
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxi2NZ_Itxf9X1A43SOZ34BEzfZLD12tSfhuvmdplAuMihOwl4URgVw84ghYGzuEgqT/exec';

  (function () {
    const ok = /^https:\/\/script\.google\.com\/.+\/exec$/.test(APPS_SCRIPT_URL.trim());
    const msg = document.getElementById('msg');
    if (!ok) {
      msg.innerHTML = 'Falta configurar la máscara.<br>Abre <code>index.html</code> y pega tu URL <code>/exec</code> en <code>APPS_SCRIPT_URL</code>.';
      document.getElementById('bar').style.display = 'none';
      return;
    }
    // Reenvía los parámetros (ej. ?p=AB12CD) a la app
    const url = APPS_SCRIPT_URL.trim() + (location.search || '');
    const f = document.createElement('iframe');
    f.id = 'app';
    f.title = 'Flyra';
    f.src = url;
    f.allow = 'clipboard-read; clipboard-write; camera; microphone; fullscreen; web-share';
    f.setAttribute('allowfullscreen', '');
    f.referrerPolicy = 'no-referrer-when-downgrade';
    let listo = false;
    f.addEventListener('load', function () {
      listo = true;
      document.getElementById('splash').classList.add('off');
    });
    document.body.appendChild(f);
    setTimeout(function () {
      if (!listo) msg.innerHTML = 'Esto está tardando más de lo normal…<br><a href="' + url.replace(/"/g, '&quot;') + '" rel="noopener">Abrir la app directamente</a>';
    }, 15000);
  })();
</script>
</body>
</html>
